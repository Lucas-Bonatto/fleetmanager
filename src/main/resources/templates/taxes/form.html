<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de tributo | FleetManager</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body><div class="app-shell"><aside th:replace="~{fragments/common :: sidebar('taxes')}"></aside><main class="main-content narrow"><header class="page-header"><div><span class="eyebrow">FINANCEIRO</span><h1 th:text="${editing ? 'Editar tributo' : 'Novo tributo'}">Novo tributo</h1><p>O status será recalculado a cada acesso.</p></div></header>
<section class="panel form-panel"><form th:object="${taxForm}" th:action="${editing} ? @{/taxes/{id}(id=${taxId})} : @{/taxes}" method="post"><div class="form-errors" th:if="${#fields.hasAnyErrors()}"><strong>Revise os dados:</strong><ul><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><div class="form-grid"><label>Veículo<select th:field="*{vehicleId}"><option value="">Selecione</option><option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="|${vehicle.plate} · ${vehicle.brand} ${vehicle.model}|"></option></select></label><label>Tipo<select th:field="*{type}"><option value="">Selecione</option><option th:each="type : ${types}" th:value="${type}" th:text="${type.label}"></option></select></label><label class="span-2">Descrição<input th:field="*{description}" placeholder="IPVA 2026"></label><label>Vencimento<input type="date" th:field="*{dueDate}"></label><label>Valor<input type="number" step="0.01" min="0.01" th:field="*{amount}"></label><label class="checkbox"><input type="checkbox" th:field="*{paid}"> Pagamento realizado</label><label>Data do pagamento<input type="date" th:field="*{paymentDate}"></label></div><div class="form-actions"><a class="button ghost" th:href="@{/taxes}">Cancelar</a><button class="button primary" type="submit">Salvar tributo</button></div></form></section>
</main></div></body></html>
