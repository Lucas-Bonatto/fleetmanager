<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tributos | Controle de Frotas</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body><div class="app-shell"><aside th:replace="~{fragments/common :: sidebar('taxes')}"></aside><main class="main-content"><header class="page-header"><div><span class="eyebrow">FINANCEIRO</span><h1>Tributos e obrigações</h1><p>Status calculado automaticamente conforme a data de vencimento.</p></div><a class="button primary" th:href="@{/taxes/new}">+ Novo tributo</a></header><div th:replace="~{fragments/common :: alerts}"></div>
<section class="panel"><div class="table-wrap"><table><thead><tr><th>Veículo</th><th>Tipo</th><th>Descrição</th><th>Vencimento</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="view : ${taxes}"><td><strong class="plate" th:text="${view.tax.vehicle.plate}">ABC1D23</strong></td><td th:text="${view.tax.type.label}">IPVA</td><td th:text="${view.tax.description}">IPVA 2026</td><td th:text="${#temporals.format(view.tax.dueDate, 'dd/MM/yyyy')}">01/01/2026</td><td th:text="${#numbers.formatCurrency(view.tax.amount)}">R$ 0,00</td><td><span class="badge" th:classappend="|badge-${#strings.toLowerCase(view.status.name())}|" th:text="${view.status.label}">Status</span></td><td class="actions"><a class="button ghost small" th:href="@{/taxes/{id}/edit(id=${view.tax.id})}">Editar</a><form th:action="@{/taxes/{id}/delete(id=${view.tax.id})}" method="post" onsubmit="return confirm('Remover este tributo?')"><button class="button danger-button small" type="submit">Excluir</button></form></td></tr><tr th:if="${#lists.isEmpty(taxes)}"><td colspan="7" class="empty">Nenhum tributo cadastrado.</td></tr></tbody></table></div></section>
</main></div></body></html>
