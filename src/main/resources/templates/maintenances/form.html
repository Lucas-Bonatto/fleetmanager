<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de manutenção | Controle de Frotas</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body><div class="app-shell"><aside th:replace="~{fragments/common :: sidebar('maintenances')}"></aside><main class="main-content narrow"><header class="page-header"><div><span class="eyebrow">OFICINA</span><h1 th:text="${editing ? 'Editar manutenção' : 'Nova manutenção'}">Nova manutenção</h1><p>Informe ao menos uma próxima referência: data ou quilometragem.</p></div></header>
<section class="panel form-panel"><form th:object="${maintenanceForm}" th:action="${editing} ? @{/maintenances/{id}(id=${maintenanceId})} : @{/maintenances}" method="post"><div class="form-errors" th:if="${#fields.hasAnyErrors()}"><strong>Revise os dados:</strong><ul><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div><div class="form-grid"><label>Veículo<select th:field="*{vehicleId}"><option value="">Selecione</option><option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="|${vehicle.plate} · ${vehicle.brand} ${vehicle.model}|"></option></select></label><label>Tipo<select th:field="*{type}"><option value="">Selecione</option><option th:each="type : ${types}" th:value="${type}" th:text="${type.label}"></option></select></label><label class="span-2">Descrição<input th:field="*{description}" placeholder="Troca de óleo e filtros"></label><label>Executada em<input type="date" th:field="*{performedAt}"></label><label>Km da execução<input type="number" min="0" th:field="*{odometerAtService}"></label><label>Próxima data<input type="date" th:field="*{nextDueDate}"></label><label>Próximo km<input type="number" min="0" th:field="*{nextDueKm}"></label><label>Custo<input type="number" min="0" step="0.01" th:field="*{cost}"></label><label class="span-2">Observações<textarea th:field="*{notes}" rows="4"></textarea></label></div><div class="form-actions"><a class="button ghost" th:href="@{/maintenances}">Cancelar</a><button class="button primary" type="submit">Salvar manutenção</button></div></form></section>
</main></div></body></html>
