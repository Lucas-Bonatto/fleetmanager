spring:
  application:
    name: fleetmanager

  datasource:
    url: jdbc:h2:file:./data/fleetmanager;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: "1"
    clean-disabled: true
    validate-migration-naming: true

  thymeleaf:
    cache: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:
  seed:
    enabled: true
  security:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:Controle@123}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}
  error:
    whitelabel:
      enabled: false

---

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fleetmanager}
    username: ${PGUSER:fleetmanager}
    password: ${PGPASSWORD:fleetmanager}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  thymeleaf:
    cache: true

  h2:
    console:
      enabled: false

app:
  seed:
    enabled: false
  security:
    admin:
      username: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}
